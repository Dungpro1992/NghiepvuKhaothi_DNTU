<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Nghiệp vụ Khảo thí DNTU - DŨNG TRẦN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .correct { 
            border-color: #10b981 !important; 
            background-color: #f0fdf4 !important; 
            color: #065f46 !important; 
        }
        .incorrect { 
            border-color: #ef4444 !important; 
            background-color: #fef2f2 !important; 
            color: #991b1b !important; 
        }
        .animate-pop { animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes pop {
            0% { transform: scale(0.96); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6">

    <script>
        const ADMIN_NAME = "Dũng Trần";
        const ADMIN_FULL_BRANDING = "Phát triển bởi người đam mê khảo thí";
        const ADMIN_ZALO = "0372251694"; 
    </script>

    <!-- Login Screen -->
    <div id="login-screen" class="max-w-md w-full glass-morphism p-6 sm:p-8 rounded-3xl shadow-2xl transition-all animate-pop">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-blue-700 to-indigo-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-white font-extrabold text-2xl shadow-xl shadow-blue-500/20">
                DT
            </div>
            <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Ôn tập Khảo thí DNTU</h1>
            <p id="branding-login" class="text-blue-600 font-bold text-[11px] mt-2 uppercase tracking-wide leading-relaxed"></p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wider">Họ và tên Quý Thầy/Cô</label>
                <input type="text" id="user-name" placeholder="Nhập họ tên đầy đủ..." 
                    class="w-full px-4 py-3.5 rounded-xl border border-slate-300 focus:ring-4 focus:ring-blue-100 focus:border-blue-600 outline-none transition-all text-base font-semibold text-slate-800 placeholder-slate-400">
            </div>

            <div>
                <label class="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wider">Số lượng câu hỏi ôn tập</label>
                <select id="mode-select" class="w-full px-4 py-3.5 rounded-xl border border-slate-300 focus:ring-4 focus:ring-blue-100 focus:border-blue-600 outline-none transition-all text-base font-bold text-slate-800 bg-white">
                    <option value="100">Trọn bộ 100 câu (Khuyên dùng)</option>
                    <option value="50">Bộ 50 câu trọng tâm</option>
                    <option value="30">Bộ 30 câu ngẫu nhiên</option>
                </select>
            </div>

            <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold py-4 rounded-xl shadow-xl shadow-blue-600/30 transition-all text-base tracking-wide uppercase mt-2">
                BẮT ĐẦU ÔN TẬP
            </button>
        </div>
        
        <div class="mt-6 pt-4 border-t border-slate-200/60 text-center">
            <p class="text-[13px] font-medium text-slate-400">Tác giả & Hỗ trợ: <strong class="text-slate-600">Dũng Trần</strong></p>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden max-w-2xl w-full glass-morphism p-5 sm:p-8 rounded-3xl shadow-2xl relative animate-pop my-4">
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2 rounded-full mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-300 w-0"></div>
        </div>

        <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
            <div>
                <span id="question-counter" class="text-xs font-black text-blue-700 bg-blue-100/80 px-3.5 py-1.5 rounded-full uppercase tracking-wider">Câu 1</span>
                <span id="display-name" class="ml-2 text-xs sm:text-sm font-bold text-slate-600"></span>
            </div>
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div id="timer" class="text-sm font-black font-mono text-slate-600">00:00</div>
            </div>
        </div>

        <div id="question-container">
            <h2 id="question-text" class="text-base sm:text-lg font-bold text-slate-900 mb-6 leading-snug"></h2>
            <div id="options-container" class="grid grid-cols-1 gap-3"></div>
            
            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden mt-5 p-4 rounded-2xl bg-blue-50/90 border border-blue-200/80 text-slate-700 text-sm leading-relaxed animate-pop">
                <div class="font-extrabold text-blue-900 mb-1 flex items-center gap-1.5 text-xs uppercase tracking-wider">
                    <svg class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Giải thích & Quy định liên quan:
                </div>
                <div id="explanation-text" class="text-xs sm:text-sm font-medium text-slate-800"></div>
            </div>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
            <div id="feedback" class="text-sm font-bold italic text-slate-700 w-full sm:w-auto text-center sm:text-left"></div>
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full sm:w-auto bg-slate-900 hover:bg-black text-white px-8 py-3.5 rounded-xl font-extrabold transition-all shadow-lg active:scale-95 text-sm uppercase tracking-wider">
                TIẾP THEO ➔
            </button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden max-w-2xl w-full glass-morphism p-6 sm:p-8 rounded-3xl shadow-2xl animate-pop my-4 flex flex-col md:flex-row gap-8">
        
        <!-- Left Side: Result Summary -->
        <div class="flex-1 text-center">
            <div class="mb-6">
                <div id="result-icon" class="inline-flex items-center justify-center w-20 h-20 rounded-3xl mb-3 shadow-inner"></div>
                <h2 class="text-2xl font-black text-slate-900" id="result-title">Kết quả</h2>
                <p id="final-score-display" class="text-5xl font-black text-blue-600 my-3 tracking-tight"></p>
                <p id="final-username" class="text-xs sm:text-sm text-slate-500 font-bold"></p>
            </div>
            
            <div id="summary-msg" class="bg-blue-50/80 text-blue-900 p-4 rounded-2xl mb-6 text-xs sm:text-sm font-semibold leading-relaxed border border-blue-200/80"></div>

            <div class="space-y-3">
                <button onclick="sendResult()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex flex-col items-center justify-center">
                    <span class="text-sm uppercase tracking-wider">GỬI KẾT QUẢ CHO ADMIN</span>
                    <span class="text-[11px] font-medium opacity-90 mt-0.5">Zalo Admin (Tự động Copy & Mở Zalo)</span>
                </button>
                <button onclick="location.reload()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 rounded-xl transition-all text-sm">
                    LÀM LẠI TỪ ĐẦU
                </button>
            </div>
        </div>

        <!-- Right Side: Leaderboard -->
        <div class="flex-1 border-t md:border-t-0 md:border-l border-slate-200 pt-6 md:pt-0 md:pl-6">
            <h3 class="text-lg font-black text-slate-800 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                Hoàn thành gần đây
            </h3>
            <div id="leaderboard-list" class="space-y-3 max-h-[350px] overflow-y-auto custom-scrollbar pr-2">
                <div class="text-center text-sm text-slate-400 py-4">Đang tải dữ liệu...</div>
            </div>
        </div>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Mock Firebase Config for standalone execution
        const firebaseConfig = {
            apiKey: "mock-key",
            authDomain: "mock-domain",
            projectId: "mock-project",
        };
        const appId = 'dntu-khao-thi-quiz';
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch(e) { console.log("Firebase setup skipped for preview"); }

        document.getElementById('branding-login').innerText = ADMIN_FULL_BRANDING;
        
        // Ngân hàng 100 câu hỏi chuyên môn + 1 câu đặc biệt
        const rawBank = [
            // --- NHÓM 1: THỜI GIAN, QUY ĐỊNH, ĐÁNH GIÁ QUÁ TRÌNH (12 CÂU) ---
            { q: "Thời hạn quy định giảng viên phải nhập điểm quá trình lên hệ thống quản lý đào tạo sau khi kết thúc học phần là bao lâu?", o: ["03 ngày", "05 ngày", "07 ngày", "14 ngày"], c: 0, exp: "Theo QĐ 312, giảng viên phải nhập điểm quá trình trong vòng 03 ngày kể từ ngày kết thúc học phần." },
            { q: "Thời hạn tải hồ sơ minh chứng Đánh giá quá trình lên hệ thống lưu trữ dữ liệu Nhà trường (NAS) là bao lâu?", o: ["03 ngày sau khi kết thúc học phần", "05 ngày sau khi kết thúc học phẩn", "07 ngày sau khi kết thúc học phần", "Phải thực hiện trong ngày"], c: 2, exp: "Đơn vị chuyên môn tải lên NAS trong vòng 07 ngày kể từ ngày kết thúc học phần." },
            { q: "Học phần 01 tín chỉ bắt buộc có bao nhiêu cột điểm kiểm tra Thường xuyên?", o: ["01 cột", "02 cột", "03 cột", "Không cần"], c: 1, exp: "Học phần 1 TC và các HP chính trị, pháp luật yêu cầu 02 cột điểm Thường xuyên." },
            { q: "Học phần từ 02 tín chỉ trở lên bắt buộc có bao nhiêu cột điểm kiểm tra Thường xuyên?", o: ["01 cột", "02 cột", "03 cột", "04 cột"], c: 2, exp: "Học phần từ 2 TC trở lên yêu cầu 03 cột điểm kiểm tra Thường xuyên." },
            { q: "Đối với học phần Khóa luận tốt nghiệp/Thực tập/Đồ án, điểm đánh giá thường xuyên chiếm bao nhiêu %?", o: ["0% (Không thực hiện)", "30%", "50%", "10%"], c: 0, exp: "Không thực hiện ĐGTX; điểm học phần được xác định hoàn toàn (100%) bằng điểm đánh giá cuối kỳ/cuối khóa." },
            { q: "Công thức chuẩn tính Điểm Học Phần là?", o: ["30% Quá trình + 70% Cuối kỳ", "40% Quá trình + 60% Cuối kỳ", "50% Quá trình + 50% Cuối kỳ", "100% Cuối kỳ"], c: 2, exp: "Điểm học phần = 50% Điểm quá trình + 50% Điểm cuối kỳ." },
            { q: "Công thức tính Điểm Quá Trình là?", o: ["30% Thường xuyên + 20% Giữa kỳ", "20% Thường xuyên + 30% Giữa kỳ", "50% Thường xuyên", "40% Thường xuyên + 10% Giữa kỳ"], c: 0, exp: "Điểm Quá trình = 30% Thường xuyên + 20% Giữa kỳ." },
            { q: "Trong vòng bao nhiêu ngày kể từ ngày kết thúc học phần, giảng viên phải hoàn tất nhập điểm quá trình VÀ xét tư cách dự thi?", o: ["03 ngày", "05 ngày", "07 ngày", "10 ngày"], c: 0, exp: "Giảng viên phải chốt danh sách cấm thi, nhập điểm QT và xét tư cách dự thi trong vòng 03 ngày." },
            { q: "Để xem danh sách sinh viên vắng thi và điểm danh, Giảng viên vào Menu nào trên Portal?", o: ["Nhập điểm cuối kỳ", "Điểm danh sinh viên", "Lịch theo tiến độ", "Quản lý thi lại"], c: 1, exp: "Vào mục Điểm danh sinh viên -> Chọn đợt, ngày, lớp để thao tác." },
            { q: "Trong quy trình nhập điểm Thường kỳ (Quá trình), sau khi nhập xong, giảng viên bắt buộc cần thao tác nút nào để hệ thống chốt danh sách?", o: ["Gửi điểm", "Khóa điểm & Xét điều kiện dự thi", "Lưu nháp", "Chỉ cần Import"], c: 1, exp: "Bắt buộc nhấn 'Khóa điểm & Xét điều kiện dự thi' để hệ thống chốt danh sách." },
            { q: "Trường hợp có điều chỉnh điểm sau phúc khảo, ai là người phê duyệt cuối cùng?", o: ["Trưởng Khoa", "Phòng Đào tạo", "Hiệu trưởng (Thông qua Phòng KT&ĐBCL)", "Giảng viên tự sửa"], c: 2, exp: "Trường hợp có điều chỉnh điểm, đơn vị chuyên môn phải lập biên bản gửi TTKT trình Hiệu trưởng phê duyệt." },
            { q: "Phòng ban nào đóng vai trò đầu mối tổ chức các kỳ thi kết thúc học phần toàn trường?", o: ["Phòng Đào tạo", "Phòng CTSV", "Phòng KT&ĐBCL", "Các Khoa"], c: 2, exp: "Trung tâm Khảo thí chịu trách nhiệm tổ chức, quản lý và điều phối hoạt động khảo thí toàn trường." },

            // --- NHÓM 2: PHẦN MỀM & QUY TRÌNH NHẬP ĐIỂM (10 CÂU) ---
            { q: "Phần mềm quản lý đào tạo và điểm chính thức hiện nay của DNTU là gì?", o: ["Excel Online", "Google Sheets", "Hệ thống Quản lý đào tạo (PSC/Portal)", "Moodle"], c: 2, exp: "Hệ thống PSC / Portal (giangvien.dntu.edu.vn) là kênh chính thức nhập và quản lý điểm số toàn trường." },
            { q: "Quy trình nhập điểm chấm thi tự luận (trên giấy) từ túi bài thi lên phần mềm gồm mấy bước cơ bản?", o: ["4 bước", "5 bước", "6 bước", "7 bước"], c: 2, exp: "Gồm 6 bước: 1. Chọn menu Túi bài thi; 2. Nhận bài (G209); 3. Chấm vào phiếu; 4. Xuất mẫu import; 5. Import điểm; 6. Gửi điểm." },
            { q: "Khi nhập điểm thi tự luận, sau khi Import và Lưu điểm, bước cuối cùng giảng viên phải làm là gì?", o: ["Tự khóa điểm", "Xuất bảng điểm", "Gửi điểm", "In ra giấy nộp"], c: 2, exp: "Sau khi Import và Lưu điểm, GV phải nhấn nút 'Gửi điểm' để hoàn tất quá trình trên hệ thống." },
            { q: "Quy trình nhập điểm môn thi VẤN ĐÁP trên phần mềm PSC gồm mấy bước?", o: ["3 bước", "4 bước", "5 bước", "6 bước"], c: 2, exp: "5 bước: 1. QL Kết quả học tập -> 2. QL tổ chức thi HP -> 3. Nhập điểm theo lịch thi -> 4. Chọn đợt/Cơ sở/Loại thi -> 5. Chọn học phần." },
            { q: "Menu để nhập điểm môn Vấn đáp trên hệ thống là gì?", o: ["Nhập điểm cuối kỳ", "Nhập điểm túi bài thi - GV", "Nhập điểm theo lịch thi", "Chấm thi phúc khảo"], c: 2, exp: "Môn Vấn đáp có lịch thi cụ thể, giảng viên vào 'Nhập điểm theo lịch thi' để nhập." },
            { q: "Menu để nhập điểm môn thi Tự luận (chấm qua túi bài) trên hệ thống là gì?", o: ["Nhập điểm theo lịch thi", "Nhập điểm túi bài thi - GV", "Nhập điểm thường kỳ", "Điểm danh sinh viên"], c: 1, exp: "Chấm tự luận theo túi phách, do đó GV vào 'Nhập điểm túi bài thi - GV'." },
            { q: "Địa điểm tiếp nhận, bàn giao bài thi và xử lý các nghiệp vụ Khảo thí tại DNTU nằm ở đâu?", o: ["Nhà A", "Phòng G101", "Phòng KT&ĐBCL(Phòng G209)", "Thư viện"], c: 2, exp: "Phòng KT&ĐBCL tọa lạc tại Tầng 2, Nhà G (Phòng G209)." },
            { q: "Đối với hình thức thi Thực hành trên máy tính, giảng viên cần lưu trữ minh chứng gì lên NAS?", o: ["Không cần lưu", "File bài làm SV + Bảng điểm + Đề thi", "Chỉ chụp hình SV đang thi", "Chỉ lưu bảng điểm"], c: 1, exp: "Đơn vị chuyên môn phải tải toàn bộ minh chứng: File bài làm, đề thi, tiêu chí/đáp án, bảng điểm lên NAS." },
            { q: "Ai là người có trách nhiệm lập danh sách người học bị cấm thi?", o: ["Cố vấn học tập", "Phòng KT&ĐBCL", "Giảng viên phụ trách môn học", "Phòng Đào tạo"], c: 2, exp: "Giảng viên chịu trách nhiệm thông báo DS cấm thi vào buổi học cuối cùng và khóa điểm trên hệ thống." },
            { q: "Cần làm gì khi giảng viên nhập nhầm điểm lên hệ thống sau khi đã khóa/gửi điểm?", o: ["Bỏ qua", "Tự báo IT mở khóa", "Lập biên bản giải trình kèm minh chứng trình Trưởng đơn vị và Phòng KT&ĐBCL", "Xóa bài thi"], c: 2, exp: "Phải làm biên bản giải trình, kèm minh chứng nộp về TTKT để được hỗ trợ sửa điểm." },

            // --- NHÓM 3: 11 HÌNH THỨC ĐÁNH GIÁ & RUBRIC (18 CÂU) ---
            { q: "Theo quy định hiện hành, DNTU có tổng cộng bao nhiêu hình thức đánh giá kết quả học tập?", o: ["7 hình thức", "9 hình thức", "10 hình thức", "11 hình thức"], c: 3, exp: "Có tổng cộng 11 hình thức đánh giá (từ Bài tập thường xuyên đến Khóa luận)." },

            { q: "Sinh viên muốn XIN HOÃN THI phải nộp đơn kèm minh chứng trong thời hạn nào?", o: ["Chậm nhất 07 ngày làm việc kể từ khi lịch công bố hoặc ngày vắng thi", "Chậm nhất 03 ngày làm việc kể từ khi lịch công bố hoặc ngày vắng thi", "Trước 1 tháng", "Trong ngày thi"], c: 1, exp: "Hạn chót nộp đơn hoãn thi là 03 ngày làm việc." },
            { q: "Khi sinh viên được phê duyệt hoãn thi hợp lệ, điểm học phần tạm thời ghi nhận trên hệ thống là?", o: ["Điểm F", "Điểm 0", "Điểm I", "Bỏ trống"], c: 2, exp: "Hệ thống ghi nhận điểm 'I (Incomplete)' cho các trường hợp hoãn thi hợp lệ." },
            { q: "Kỳ thi bổ sung (thi cho người hoãn thi) thường được tổ chức vào thời gian nào?", o: ["Tuần thứ 1 và thứ 2 của học kỳ kế tiếp", "Tuần 4 và thứ 5 của học kỳ kế tiếp", "Cuối học kỳ", "Thi cùng sinh viên rớt"], c: 1, exp: "Lịch thi bổ sung tổ chức vào tuần thứ 4 và thứ 5 của học kỳ kế tiếp." },
            { q: "Nếu Giảng viên muốn đổi người coi thi do có việc đột xuất, quy trình đúng là gì?", o: ["Tự nhờ đồng nghiệp coi thay", "Báo Trưởng khoa duyệt", "Báo Khoa/bộ môn đổi người và phải được Phòng KT&ĐBCL đồng ý", "Bỏ coi thi"], c: 2, exp: "Phải báo Khoa/BM và ĐƯỢC Phòng KT&ĐBCL đồng ý (thông báo trước 90 phút)." },
            { q: "Tỷ lệ tham dự lớp tối thiểu (chuyên cần) để sinh viên được dự thi cuối kỳ thường là?", o: ["50%", "100%", "80% (hoặc theo quy định HP)", "60%"], c: 2, exp: "SV phải đảm bảo chuyên cần (thường 80% thời lượng) mới đủ điều kiện dự thi kết thúc học phần." },
            { q: "Nhận định sau đây ĐÚNG hay SAI: 'Lịch thi không tập trung chỉ được báo trước 7 ngày'?", o: ["Đúng", "Sai", "Tùy môn", "Tùy Giảng viên"], c: 1, exp: "Sai. Lịch thi không tập trung công bố sớm trong vòng 03 tuần từ khi bắt đầu học kỳ." },
            { q: "Cán bộ coi thi đến trễ hoặc không tham gia coi thi sẽ bị xử lý như thế nào?", o: ["Không sao", "Chỉ nhắc nhở nhẹ", "Xử lý kỷ luật từ nghiêm khắc phê bình đến buộc thôi việc", "Trừ lương tháng"], c: 2, exp: "Coi thi là nhiệm vụ quan trọng, vi phạm sẽ bị xử lý kỷ luật theo quy định Nhà trường." },

            // --- NHÓM 7: CÔNG TÁC COI THI & iTEST (15 CÂU) ---
            { q: "Giai đoạn trước giờ thi, Cán bộ coi thi phải có mặt tại phòng Hội đồng trước bao nhiêu phút?", o: ["15 phút", "20 phút", "30 phút", "45 phút"], c: 2, exp: "Quy định Nội quy phòng thi: CBCT phải có mặt trước 30 phút để nhận hồ sơ, sinh hoạt ca thi." },
            { q: "Trước khi thi, Cán bộ coi thi phải ghi các thông tin gì lên bảng?", o: ["Chỉ ghi Môn thi", "Kỳ thi, ngày, môn, thời gian, tia thời gian, sơ đồ chỗ ngồi, các lưu ý", "Lời chúc thi tốt", "Không cần ghi"], c: 1, exp: "Bắt buộc ghi đầy đủ thông tin kỳ thi, tia thời gian, vẽ sơ đồ và các lưu ý (tắt đt...)." },
            { q: "Khi phát hiện sinh viên mặc đồng phục KHÔNG ĐÚNG quy định, Giám thị xử lý thế nào?", o: ["Cho vào thi bình thường", "Trừ điểm", "Không cho vào thi, yêu cầu về thay đồng phục đúng quy định", "Lập biên bản"], c: 2, exp: "Giám thị kiểm tra đồng phục & thẻ trước cửa, nếu sai yêu cầu về thay." },
            { q: "Sinh viên KHÔNG CÓ thẻ sinh viên/CCCD khi vào phòng thi phải xử lý thế nào?", o: ["Đuổi về không cho thi", "Làm Giấy cam đoan tại phòng Hội đồng và bổ sung giấy tờ trong vòng 24h", "Cho mượn thẻ", "Lập biên bản vi phạm"], c: 1, exp: "Sinh viên quên giấy tờ tùy thân phải xuống phòng Hội đồng làm cam đoan, bổ sung trong 24h." },
            { q: "Trong thời gian coi thi, hành vi nào sau đây KHÔNG ĐƯỢC PHÉP thực hiện?", o: ["Quan sát sinh viên", "Ký giấy nháp", "Đọc báo, viết vẽ, nói chuyện riêng, sử dụng điện thoại, ngồi 1 chỗ", "Thu bài"], c: 2, exp: "Nghiêm cấm làm việc riêng, sử dụng điện thoại và thiếu tập trung trong ca thi." },
            { q: "Nếu Giám thị cần ra ngoài trong giờ thi (đi vệ sinh, sự cố đột xuất), quy trình đúng là?", o: ["Tự ý ra ngoài", "Nhờ sinh viên trông lớp", "Khóa cửa phòng thi", "Phải đề nghị Giám sát phòng thi hỗ trợ trông lớp"], c: 3, exp: "Giám thị tuyệt đối không tự ý rời phòng, phải nhờ Giám sát hỗ trợ mới được ra." },
            { q: "Đặc thù coi thi trên máy tính (Hệ thống iTest): Giám thị 1 (GT1) có được dùng Laptop cá nhân không?", o: ["Không", "Có, Được phép sử dụng laptop cá nhân để giám sát hệ thống iTest", "Dùng để lướt web", "Ai cũng được dùng"], c: 1, exp: "Chỉ GT1 được dùng laptop để điều khiển ca thi, cấp/mở khóa iTest." },
            { q: "Đặc thù coi thi trên máy tính (Hệ thống iTest): Giám thị 2 (GT2) có được dùng máy tính không?", o: ["Được dùng", "Chỉ dùng điện thoại", "KHÔNG sử dụng máy tính. Phải quan sát trực tiếp toàn bộ phòng thi", "Dùng chung với GT1"], c: 2, exp: "GT2 cấm dùng máy tính, nhiệm vụ là đi lại quan sát trực tiếp màn hình và thao tác của thí sinh." },
            { q: "Vật dụng nào sau đây KHÔNG ĐƯỢC mang vào chỗ ngồi trong phòng thi?", o: ["Bút chì", "Máy tính cá nhân (Calculator)", "Thước kẻ", "Áo khoác"], c: 3, exp: "Điện thoại (dù tắt nguồn), túi xách, áo khoác phải để ở bục giảng tự quản lý." },
            { q: "Đối với thi Tự luận, sinh viên được phép nộp bài và ra về sớm nhất sau khoảng thời gian nào?", o: ["1/3 thời gian", "1/2 thời gian", "Sau 2/3 thời gian thi", "Hết giờ mới được về"], c: 2, exp: "Chỉ cho phép thí sinh ra khỏi phòng thi khi đã hết 2/3 thời gian làm bài." },
            { q: "Giám thị ký giấy nháp và giấy thi như thế nào là đúng quy định?", o: ["Ký sẵn 1 xấp để đó", "Ký số lượng vừa đủ phát cho sinh viên, không ký dư", "Sinh viên xin bao nhiêu ký bấy nhiêu", "Không cần ký giấy nháp"], c: 1, exp: "Giám thị ký số lượng vừa đủ, kiểm soát chặt chẽ giấy thi/nháp." },
            { q: "Giám thị mở niêm phong túi đề thi như thế nào là đúng quy định?", o: ["Tự mở một mình", "Mở trước mặt Giám sát", "Mở công khai, yêu cầu 02 thí sinh đại diện ký xác nhận phong bì còn nguyên", "Đem vào góc phòng mở"], c: 2, exp: "Giám thị giơ cao túi đề còn nguyên niêm phong và phải có 2 SV ký biên bản chứng kiến." },
            { q: "Trách nhiệm lưu bài/nộp bài thi trên hệ thống iTest thuộc về ai?", o: ["Giám thị 1", "Hệ thống tự động lưu", "Thí sinh hoàn toàn tự chịu trách nhiệm nếu làm sai thao tác", "IT Trường"], c: 2, exp: "Thí sinh phải tuân thủ hướng dẫn. Nếu thao tác sai dẫn đến lỗi/không nộp bài, thí sinh tự chịu trách nhiệm." },
            { q: "Khi sinh viên báo mất tài sản trong phòng thi, Giám thị xử lý thế nào?", o: ["Đóng cửa phòng thi xét hỏi", "Hủy ca thi", "Hướng dẫn sinh viên đến Phòng CTSV để được giúp đỡ", "Không quan tâm"], c: 2, exp: "Tài sản SV tự quản lý. Nếu mất, Giám thị hướng dẫn SV báo cáo CTSV hỗ trợ." },
            { q: "Đối với môn thi trắc nghiệm trên giấy, sinh viên dùng viết gì để tô phiếu OMR?", o: ["Bút mực xanh", "Bút bi đen", "Bút chì (như 2B)", "Bút dạ quang"], c: 2, exp: "Chỉ được tô bằng bút chì để máy quét OMR nhận diện chính xác." },

            // --- NHÓM 8: XỬ LÝ VI PHẠM (9 CÂU) ---
            { q: "Lỗi 'Nhìn bài của thí sinh khác' (Lần 1) chịu mức phạt nào?", o: ["Khiển trách (Trừ 25% số điểm thi)", "Cảnh cáo (Trừ 50% số điểm thi)", "Đình chỉ", "Nhắc nhở không trừ điểm"], c: 0, exp: "Nhìn bài, nói chuyện, ngồi sai vị trí (lần đầu) bị phạt Khiển trách trừ 25%." },
            { q: "Khi thi iTest, thí sinh thu nhỏ màn hình hoặc mở tab/ứng dụng khác quá 15 giây bị phạt mức nào?", o: ["Cảnh cáo", "Khiển trách (Trừ 25% điểm thi)", "Đình chỉ", "Hủy ca thi"], c: 1, exp: "Thoát chế độ toàn màn hình iTest > 15s bị phạt Khiển trách trừ 25%." },
            { q: "Lỗi 'Trao đổi bài thi hoặc giấy nháp với nhau' chịu mức phạt nào?", o: ["Khiển trách (Trừ 25%)", "Cảnh cáo (Trừ 50%)", "Đình chỉ", "Trừ 100%"], c: 1, exp: "Trao đổi bài/nháp, hoặc tái phạm lỗi Khiển trách sẽ bị Cảnh cáo trừ 50% điểm." },
            { q: "Lỗi 'Chép bài của thí sinh khác hoặc cho người khác chép bài' phạt mức nào?", o: ["Khiển trách (Trừ 25%)", "Cảnh cáo (Trừ 50%)", "Đình chỉ", "Chỉ hủy bài người chép"], c: 1, exp: "Chép bài/cho chép bài là vi phạm Cảnh cáo, trừ 50% số điểm thi của môn đó." },
            { q: "Hành vi 'Mang điện thoại vào phòng thi' (dù đã tắt nguồn) bị xử lý thế nào?", o: ["Thu giữ đến hết giờ", "Trừ 50% điểm", "Đình chỉ thi, Hủy kết quả bài thi", "Chỉ nhắc nhở"], c: 2, exp: "Mang điện thoại/thiết bị thu phát vào khu vực thi lập tức bị Đình chỉ thi (Điểm 0)." },
            { q: "Mang tài liệu vào phòng thi (đối với môn KHÔNG ĐƯỢC sử dụng tài liệu) bị phạt mức nào?", o: ["Cảnh cáo", "Trừ 50% điểm", "Đình chỉ thi, hủy kết quả", "Tịch thu tài liệu"], c: 2, exp: "Phát hiện tài liệu tại chỗ ngồi/trong người dù chưa sử dụng đều bị Đình chỉ thi." },
            { q: "Sinh viên có hành vi 'Nhờ người khác làm bài thi hộ hoặc làm bài thi hộ' bị xử lý ra sao?", o: ["Cảnh cáo", "Trừ 50% điểm", "Đình chỉ thi, xử lý kỷ luật toàn trường", "Cấm thi môn đó"], c: 2, exp: "Thi hộ là vi phạm cực kỳ nghiêm trọng, xử lý kỷ luật theo quy định của Hội đồng (có thể đuổi học)." },
            { q: "Sinh viên có thái độ đe dọa, gây gỗ với Cán bộ coi thi sẽ bị xử lý mức nào?", o: ["Nhắc nhở", "Trừ 25% điểm", "Đình chỉ thi, hủy kết quả và kỷ luật", "Mời ra khỏi lớp"], c: 2, exp: "Thiếu tôn trọng, đe dọa Giám thị thuộc lỗi Đình chỉ thi và Kỷ luật học vụ." },
            { q: "Sinh viên vi phạm và bị lập biên bản Đình chỉ thi môn A, sinh viên có được dự thi môn B tiếp theo không?", o: ["Tuyệt đối không", "Có, vẫn được thi môn B bình thường", "Tùy giám thị", "Hủy toàn bộ kỳ thi"], c: 1, exp: "Đình chỉ thi áp dụng cho từng học phần vi phạm, SV vẫn được dự thi các môn khác." },

            // --- NHÓM 9: CHẤM THI, NHẬP ĐIỂM, PHÚC KHẢO, THI LẠI (14 CÂU) ---
            { q: "Thời gian TỐI ĐA để Giảng viên hoàn thành chấm bài thi tự luận (bao gồm cả nhập điểm) là bao lâu?", o: ["03 ngày", "05 ngày", "07 ngày làm việc kể từ ngày nhận túi bài thi", "10 ngày"], c: 2, exp: "Quy định chấm bài tự luận là không quá 07 ngày làm việc. Quá thời hạn, hệ thống khóa nhập điểm." },
            { q: "Giảng viên sử dụng bút màu gì để chấm thi tự luận trên bài thi?", o: ["Bút xanh", "Bút đen", "Bút đỏ (không dùng chì, xóa, mực khác)", "Tùy ý"], c: 2, exp: "Quy định chấm thi bắt buộc Giảng viên sử dụng mực đỏ, ghi điểm rõ ràng." },
            { q: "Hình thức chấm bài Tự luận được thực hiện bởi 2 giảng viên như thế nào?", o: ["Chấm chung", "GV1 chấm trên phiếu chấm, GV2 chấm trực tiếp trên bài thi", "Cả 2 GV chấm trên bài", "Chỉ 1 GV chấm"], c: 1, exp: "GV1 chấm độc lập trên phiếu (không ghi lên bài), GV2 chấm trực tiếp trên bài thi." },
            { q: "Khi chênh lệch điểm giữa 2 GV chấm thi DƯỚI 1.0 điểm, cách xử lý là gì?", o: ["Lấy điểm cao hơn", "Hai GV tự thảo luận thống nhất, lập biên bản, ghi điểm, Trình Trưởng Bộ môn phê duyệt", "Cộng chia đôi", "Phòng KT chấm"], c: 1, exp: "Chênh lệch < 1.0 thì 2 GV tự hội ý thống nhất và trình Trưởng Bộ môn duyệt." },
            { q: "Khi chênh lệch điểm giữa 2 GV chấm thi TỪ 1.0 điểm TRỞ LÊN, cách xử lý là gì?", o: ["Chia đôi", "Phối hợp Trưởng Bộ môn thống nhất, lập biên bản, Trình Lãnh đạo Khoa phê duyệt", "Hủy bài thi", "GV1 quyết định"], c: 1, exp: "Chênh lệch >= 1.0 phải có Trưởng Bộ môn can thiệp và Lãnh đạo Khoa phê duyệt." },
            { q: "Đối với học phần có hình thức thi KHÔNG TẬP TRUNG, thời hạn hoàn tất chấm và nhập điểm là bao lâu?", o: ["Tối đa 07 ngày kể từ ngày tổ chức thi", "Tối đa 10 ngày kể từ ngày tổ chức thi", "Tối đa 14 ngày kể từ ngày tổ chức thi", "Tối đa 21 ngày kể từ ngày tổ chức thi"], c: 2, exp: "Giảng viên phải hoàn tất nhập điểm thi Không tập trung tối đa 14 ngày kể từ ngày thi." },
            { q: "Trong vòng bao nhiêu ngày kể từ ngày nhận dữ liệu điểm, giảng viên phải hoàn tất Phân tích phổ điểm?", o: ["Trong vòng 02 ngày làm việc", "Không quá 03 ngày làm việc", "Không quá 05 ngày làm việc", "Không quá 07 ngày làm việc"], c: 2, exp: "Quy định thời gian phân tích phổ điểm (GV làm) là tối đa 05 ngày làm việc." },
            { q: "Thời hạn tối đa để CÔNG BỐ ĐIỂM thi chính thức cho sinh viên là bao lâu?", o: ["Tối đa 07 ngày làm việc kể từ ngày thi", "Tối đa 10 ngày làm việc kể từ ngày thi", "Tối đa 14 ngày làm việc kể từ ngày thi", "Tối đa 21 ngày làm việc kể từ ngày thi"], c: 2, exp: "Trung tâm Khảo thí công bố điểm tối đa 14 ngày làm việc kể từ khi thi." },
            { q: "Người học nộp đơn xin PHÚC KHẢO bài thi trong thời hạn nào?", o: ["Trong 03 ngày kể từ ngày công bố điểm", "Trong 07 ngày kể từ ngày công bố điểm", "Trong 14 ngày kể từ ngày công bố điểm", "Trong 01 tháng kể từ ngày công bố điểm"], c: 1, exp: "Đơn phúc khảo nộp tại One-Stop (Hỗ trợ người học) trong vòng 07 ngày sau khi có điểm." },
            { q: "Hình thức thi nào KHÔNG được áp dụng Phúc khảo?", o: ["Tự luận", "Trắc nghiệm", "Vấn đáp", "Thực hành trên máy"], c: 2, exp: "Phúc khảo chỉ áp dụng cho thi cuối kỳ tập trung trực tiếp/trực tuyến, KHÔNG áp dụng cho VẤN ĐÁP." },
            { q: "Khoa phân công Giảng viên chấm phúc khảo và nhập điểm trong thời hạn tối đa bao lâu?", o: ["Tối đa 03 ngày làm việc", "Tối đa 05 ngày làm việc", "Tối đa 07 ngày làm việc", "Tối đa 10 ngày làm việc"], c: 1, exp: "Thời hạn giải quyết phúc khảo tại Khoa là tối đa 05 ngày làm việc." },
            { q: "Kỳ THI LẠI cuối kỳ áp dụng cho các hình thức đánh giá nào?", o: ["Tất cả các hình thức", "Chỉ áp dụng cho THI CUỐI KỲ TẬP TRUNG (Không áp dụng Vấn đáp)", "Tiểu luận và Đồ án", "Chỉ Trắc nghiệm"], c: 1, exp: "Thi lại chỉ áp dụng cho môn thi Tập trung. Đặc biệt KHÔNG áp dụng thi lại cho Vấn đáp." },
            { q: "Điểm học phần sau khi THI LẠI được quy định mức TỐI ĐA là bao nhiêu?", o: ["Tính bình thường", "Không vượt quá mức điểm B", "Không vượt quá mức điểm C", "Chỉ tính điểm D"], c: 2, exp: "Sinh viên thi lại dù 10 điểm thì tổng kết môn tối đa chỉ nhận được điểm C (Tương đương 6.9)." },
            { q: "Đối với học phần đăng ký thi lại, 'Điểm thi cuối kỳ' được tính như thế nào?", o: ["Lấy trung bình 2 lần thi", "Tính theo kết quả của LẦN THI LẠI (Có khống chế tổng điểm)", "Lấy điểm cao hơn", "Cộng dồn"], c: 1, exp: "Hệ thống lấy điểm bài thi lại để tính lại trung bình, nhưng khống chế điểm tổng kết max C." },

            // --- CÂU SỐ 101: CÂU ĐẶC BIỆT ---
            { q: "Quý Thầy/Cô có sẵn sàng mời Admin ly cafe không?", o: ["Để hôm nào có dịp...", "Không", "Lưỡng lự", "Tất nhiên rồi"], c: 3, exp: "Cảm ơn Quý Thầy/Cô! Sự ủng hộ của Thầy/Cô là động lực rất lớn." } // CÂU 101
        ];

        let questions = [];
        let currentIdx = 0;
        let score = 0;
        let startTime, endTime;
        let userName = "";
        let selectedCoffeeOption = "";

        window.startQuiz = async function() {
            const input = document.getElementById('user-name');
            if (input.value.trim() === "") {
                alert("Vui lòng nhập Họ và Tên của Quý Thầy/Cô để ghi nhận kết quả!");
                return;
            }
            userName = input.value.trim();
            
            // Login to Firebase Anonymously if not already
            if (auth && !auth.currentUser) {
                try {
                    await signInAnonymously(auth);
                } catch(e) {
                    console.error("Auth failed, continuing without saving", e);
                }
            }
            
            const count = parseInt(document.getElementById('mode-select').value);
            
            // Tách câu hỏi mời cafe ra khỏi việc xáo trộn chung
            const regularQuestions = rawBank.slice(0, rawBank.length - 1); // 100 câu
            const coffeeQuestion = rawBank[rawBank.length - 1]; // Câu 101
            
            const shuffled = [...regularQuestions].sort(() => 0.5 - Math.random());
            
            // Lấy đủ số lượng câu hỏi chuyên môn user chọn (count)
            questions = shuffled.slice(0, Math.min(count, regularQuestions.length));
            // Luôn thêm câu mời cafe vào cuối cùng
            questions.push(coffeeQuestion); 
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('display-name').innerText = `| GV: ${userName}`;
            
            startTime = new Date();
            updateTimer();
            loadQuestion();
        }

        function updateTimer() {
            const timerObj = setInterval(() => {
                if(endTime) { clearInterval(timerObj); return; }
                const now = new Date();
                const diff = Math.floor((now - startTime) / 1000);
                const m = Math.floor(diff / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        window.loadQuestion = function() {
            const q = questions[currentIdx];
            
            // Progress Bar & Counter
            const progressPercent = ((currentIdx) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('question-counter').innerText = `Câu ${currentIdx + 1}/${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            // Hide feedback & explanation
            document.getElementById('feedback').innerText = "";
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('explanation-text').innerText = "";
            document.getElementById('next-btn').classList.add('hidden');

            q.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-4 py-3.5 rounded-xl border-2 border-slate-200/80 hover:border-blue-400 hover:bg-blue-50/60 transition-all font-semibold flex justify-between items-center group text-slate-800 text-sm sm:text-base";
                btn.innerHTML = `<span>${opt}</span><span class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:bg-blue-600 group-hover:text-white transition-all ml-2 flex-shrink-0">${String.fromCharCode(65+i)}</span>`;
                btn.onclick = () => window.checkAnswer(i, btn, opt);
                container.appendChild(btn);
            });
        }

        window.checkAnswer = function(idx, btn, optText) {
            const q = questions[currentIdx];
            const correctIdx = q.c;
            const allBtns = document.querySelectorAll('#options-container button');
            allBtns.forEach(b => b.disabled = true);
            
            // Capture coffee answer if it's the last question
            if (currentIdx === questions.length - 1) {
                selectedCoffeeOption = optText;
            }

            if (idx === correctIdx) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = "<span class='text-emerald-700 font-bold'>✓ Chính xác!</span>";
                score++;
            } else {
                btn.classList.add('incorrect');
                allBtns[correctIdx].classList.add('correct');
                document.getElementById('feedback').innerHTML = "<span class='text-rose-700 font-bold'>✗ Chưa chính xác!</span>";
            }

            // Display Explanation Box
            const expText = q.exp || "Chưa có ghi chú giải thích bổ sung cho câu hỏi này.";
            document.getElementById('explanation-text').innerText = expText;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('next-btn').classList.remove('hidden');
            
            // Đổi chữ nút nếu là câu cuối
            if (currentIdx === questions.length - 1) {
                 document.getElementById('next-btn').innerText = "XEM KẾT QUẢ TỔNG HỢP ➔";
            }
        }

        window.nextQuestion = function() {
            currentIdx++;
            if (currentIdx < questions.length) window.loadQuestion();
            else showResult();
        }

        async function showResult() {
            endTime = new Date();
            const timeStr = document.getElementById('timer').innerText;
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-score-display').innerText = `${score}/${questions.length}`;
            document.getElementById('final-username').innerText = `Thầy/Cô: ${userName} | Thời gian: ${timeStr}`;
            
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('summary-msg');

            const percent = (score / questions.length) * 100;

            if (percent >= 80) {
                icon.className = "inline-flex items-center justify-center w-20 h-20 rounded-3xl mb-3 bg-emerald-100 text-emerald-600";
                icon.innerHTML = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                title.innerText = "XUẤT SẮC!";
                msg.innerText = "Kiến thức quy định & nghiệp vụ khảo thí của Quý Thầy/Cô cực kỳ vững vàng. Chúc mừng Thầy/Cô đã hoàn thành xuất sắc bài ôn tập!";
            } else if (percent >= 50) {
                icon.className = "inline-flex items-center justify-center w-20 h-20 rounded-3xl mb-3 bg-blue-100 text-blue-600";
                icon.innerHTML = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
                title.innerText = "HOÀN THÀNH!";
                msg.innerText = "Quý Thầy/Cô đã nắm được hầu hết các quy trình khảo thí cơ bản. Hãy xem lại giải thích các câu sai để ghi nhớ kỹ hơn.";
            } else {
                icon.className = "inline-flex items-center justify-center w-20 h-20 rounded-3xl mb-3 bg-rose-100 text-rose-600";
                icon.innerHTML = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';
                title.innerText = "CẦN ÔN LẠI!";
                msg.innerText = "Quý Thầy/Cô nên dành thêm thời gian xem lại Slide Tập huấn Khảo thí và QĐ 312 để nắm chính xác các quy định.";
            }

            // Save to Firebase Leaderboard
            if (db && auth.currentUser) {
                try {
                    const resultsCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                    await addDoc(resultsCol, {
                        name: userName,
                        score: score,
                        total: questions.length,
                        time: timeStr,
                        coffeeAnswer: selectedCoffeeOption || "Không trả lời",
                        timestamp: new Date().getTime()
                    });
                    loadLeaderboard(); // Load after saving
                } catch (e) {
                    console.error("Lỗi lưu kết quả", e);
                    document.getElementById('leaderboard-list').innerHTML = "<div class='text-sm text-rose-500'>Không thể tải bảng xếp hạng lúc này.</div>";
                }
            } else {
                // Not authenticated/configured properly
                 document.getElementById('leaderboard-list').innerHTML = "<div class='text-sm text-slate-500'>Tính năng bảng xếp hạng tạm thời không khả dụng.</div>";
            }
        }

        function loadLeaderboard() {
            if (!db || !auth.currentUser) return;
            
            const resultsCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            // Limit to 20 recently added docs to avoid massive queries, then sort top 5 in memory
            const q = query(resultsCol, orderBy("timestamp", "desc"), limit(20)); 
            
            onSnapshot(q, (snapshot) => {
                const results = [];
                snapshot.forEach(doc => results.push({ id: doc.id, ...doc.data() }));
                
                // Ensure sorting by timestamp descending (newest first) and take top 5
                results.sort((a, b) => b.timestamp - a.timestamp);
                const top5 = results.slice(0, 5);
                
                renderLeaderboard(top5);
            }, (error) => {
                console.error("Lỗi tải bảng xếp hạng", error);
            });
        }
        
        function renderLeaderboard(data) {
            const listEl = document.getElementById('leaderboard-list');
            if (data.length === 0) {
                listEl.innerHTML = "<div class='text-sm text-slate-500 text-center py-4'>Chưa có dữ liệu.</div>";
                return;
            }
            
            let html = "";
            data.forEach((item, index) => {
                let badgeClass = "bg-slate-100 text-slate-600";
                if(index === 0) badgeClass = "bg-amber-100 text-amber-600 border border-amber-200";
                
                // Trích xuất chữ cái đầu của tên
                const initial = item.name.charAt(0).toUpperCase();
                
                html += `
                    <div class="flex items-center gap-3 p-2.5 rounded-xl border border-slate-100 bg-white/50 hover:bg-white transition-colors">
                        <div class="w-8 h-8 rounded-full ${badgeClass} flex items-center justify-center font-bold text-xs flex-shrink-0">
                            ${initial}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-slate-800 truncate">${item.name}</div>
                            <div class="text-[10px] text-slate-500 flex items-center gap-1">
                                <span class="font-semibold text-blue-600">${item.score}/${item.total}</span>
                                <span>•</span>
                                <span>${item.time}</span>
                            </div>
                        </div>
                        <div class="text-[10px] font-medium px-2 py-1 bg-slate-50 rounded-lg whitespace-nowrap text-slate-600 border border-slate-100" title="Câu trả lời mời cafe">
                            ☕ ${item.coffeeAnswer}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        window.sendResult = function() {
            const timeStr = document.getElementById('timer').innerText;
            const percent = Math.round((score / questions.length) * 100);
            
            const report = `[BÁO CÁO KẾT QUẢ ÔN TẬP KHẢO THÍ DNTU]\n` +
                           `• Thầy/Cô: ${userName}\n` +
                           `• Kết quả: ${score}/${questions.length} câu (${percent}%)\n` +
                           `• Thời gian hoàn thành: ${timeStr}\n` +
                           `• Trả lời câu đặc biệt: ${selectedCoffeeOption}\n` +
                           `• Ngày thực hiện: ${new Date().toLocaleDateString('vi-VN')}\n` +
                           `------------------------------------\n` +
                           `${ADMIN_FULL_BRANDING}`;

            // Reliable clipboard fallback
            const tempInput = document.createElement("textarea");
            tempInput.value = report;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); // Mobile
            
            try {
                document.execCommand('copy');
                alert("Đã tự động sao chép kết quả!\nHệ thống sẽ chuyển hướng tới Zalo của Admin để Quý Thầy/Cô dán (Paste) và gửi báo cáo.");
            } catch (err) {
                alert("Không thể tự động chép bộ nhớ. Hệ thống vẫn sẽ mở Zalo cho Quý Thầy/Cô!");
            }
            document.body.removeChild(tempInput);

            // Directly open Zalo chat with Dũng Trần
            window.open(`https://zalo.me/${ADMIN_ZALO}`, '_blank');
        }
    </script>
</body>
</html>
